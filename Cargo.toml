[package]
name = "fcs_web"
version = "1.1.1"
edition = "2024"

[dependencies]
base64 = "0.23.1"
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
qrcodegen = "1.8.0"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = [
  "Document",
  "DomTokenList",
  "Element",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "MediaQueryList",
  "NodeList",
  "Window"
] }
